name: Daily data refresh

# Refreshes the data snapshot after each US trading day and commits it back.
# Streamlit Cloud redeploys on the commit, so the app is never stale.
#
# GitHub starts scheduled runs late when it is busy (2 to 10 hours late from
# September to November 2026), and the top of the hour is the busiest time.
# So each US session (Monday to Friday) has three slots, off the hour, all after
# its close (16:00 New York = 21:00 UTC in winter, 20:00 in summer), and early
# enough that even 8 hours late they start before the next open (14:30 UTC in winter):
#   22:41 UTC the same evening, then 00:29 and 02:13 UTC
#   (Israel: 00:41, 02:29, 04:13 in winter, an hour later in summer).
# data_freshness.py decides: a slot scans only when the close on screen is
# older than the last finished US session (taken from the market itself, so
# weekends and US holidays need no calendar), and never while a session is in progress.
# A failed run, or data still not current after the last slot or after a whole
# missed trading day, opens an issue, which GitHub emails to the owner.
# Manual trigger via the Actions tab (workflow_dispatch) decides the same way, so a
# second click does not scan the same day twice. Tick "force" to scan anyway
# (never while a session is in progress).

on:
  schedule:
    - cron: "41 22 * * 1-5"   # the evening of a session day, well after the bars settle
    - cron: "29 0 * * 2-6"    # backup slot
    - cron: "13 2 * * 2-6"    # backup slot, the last one for that session
  workflow_dispatch:
    inputs:
      force:
        description: "Scan even when the data is already current"
        type: boolean
        default: false

# One refresh at a time: a slot that starts while another runs waits for it.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    env:
      TZ: Asia/Jerusalem        # dates and times written into the data are Israel time
      PYTHONUTF8: "1"
      LAST_SLOT: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '13 2 * * 2-6' }}
    steps:
      # main as it is when the job starts, not when the run was queued: a run that
      # waited for another one sees that run's data, so it skips instead of scanning
      # the same day again and clashing with it on save (23/11/2026, runs 128 and 129).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Is the data current?
        id: before
        run: python data_freshness.py

      - name: Watchlist scan (run.py)
        if: steps.before.outputs.state == 'behind' || steps.before.outputs.state == 'unknown' || (inputs.force && steps.before.outputs.state != 'open')
        env:
          STOCK_AGENT_DISABLE_EMAIL: "1"
          MPLBACKEND: "Agg"
        run: python run.py

      - name: Universe scan (scanner.py ALL)
        id: scan
        if: steps.before.outputs.state == 'behind' || steps.before.outputs.state == 'unknown' || (inputs.force && steps.before.outputs.state != 'open')
        run: python scanner.py ALL

      - name: Commit refreshed snapshot
        if: steps.scan.outcome == 'success'
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: daily data refresh"
            # main may have moved during the run (a merged change): put the data on top of it.
            # The scan also rewrites files outside data/ that are not committed (dashboard/index.html).
            # --autostash sets them aside, or the pull refuses to start (every save failed 03-21/11/2026).
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Is the data current now?
        id: after
        run: python data_freshness.py

      - name: Report data that is not current
        # A missed day that this run made up is not news: only data still not current is.
        if: steps.after.outputs.state != 'current' && (env.LAST_SLOT == 'true' || steps.before.outputs.missed == '1')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="הנתונים באתר לא עודכנו בזמן $(date +%d/%m/%Y)"
          body="הסגירה המוצגת באתר: ${{ steps.after.outputs.close }}. יום המסחר האחרון שהסתיים: ${{ steps.after.outputs.last }}. מצב: ${{ steps.after.outputs.state }}. פרטים: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title $title" --json number --jq '.[].number')" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi

      - name: Report a failed refresh
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="עדכון הנתונים היומי נכשל $(date +%d/%m/%Y)"
          body="הריצה נכשלה ולכן ייתכן שהנתונים באתר לא התעדכנו. פרטים: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # one issue a day, not one for every failed slot
          if [ -z "$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title $title" --json number --jq '.[].number')" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
