<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
// Minimal Streamlit component: read/write one localStorage key and hand the
// value back to Python. Protocol: componentReady → render(args) → setComponentValue.
(function () {
  var lastSent = null;
  function post(type, extra) {
    var msg = Object.assign({ isStreamlitMessage: true, type: type }, extra || {});
    window.parent.postMessage(msg, "*");
  }
  function read(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function write(key, val) {
    try { window.localStorage.setItem(key, val); return true; } catch (e) { return false; }
  }
  window.addEventListener("message", function (ev) {
    var d = ev.data || {};
    if (d.type !== "streamlit:render") return;
    var args = d.args || {};
    var key = "stockagent:" + (args.key || "default");
    if (typeof args.write === "string") write(key, args.write);
    var val = read(key);
    var payload = JSON.stringify({ value: val, ok: true });
    if (payload !== lastSent) {
      lastSent = payload;
      post("streamlit:setComponentValue", { value: { value: val, ok: true }, dataType: "json" });
    }
  });
  post("streamlit:componentReady", { apiVersion: 1 });
  post("streamlit:setFrameHeight", { height: 0 });
})();
</script>
</body>
</html>
